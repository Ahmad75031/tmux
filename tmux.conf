set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-features ",xterm-256color:RGB"

bind r source-file $HOME/.config/tmux/tmux.conf \; display "Config Reloaded"
source-file $HOME/.config/tmux/tmux.keybinds.conf
source-file $HOME/.config/tmux/colors.conf
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g renumber-windows on
set-option -g history-limit 5000

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-left-length 200

set -g status-position top

set -g status-style "bg=default,fg=#{@thm_fg}"

set -g window-status-style "bg=default,fg=#{@thm_text_variant}"
set -g window-status-current-style "bg=default,fg=#{@thm_primary}"

set -g status-left "#[fg=#{@thm_primary}]❮#S❯ "
set -g status-right "#[fg=#{@thm_primary}]%a %b %d %I:%M%p"

set -g window-status-format "#[fg=#{@thm_text_variant}]#I❯#W"
set -g window-status-current-format "#[fg=#{@thm_primary}]#I❯#W"


set -g status-justify centre

run '~/.tmux/plugins/tpm/tpm'
