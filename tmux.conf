set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:RGB"
set -ag terminal-features ",xterm-256color:RGB"

bind r source-file $HOME/.config/tmux/tmux.conf \; display "Config Reloaded"
source-file $HOME/.config/tmux/tmux.keybinds.conf
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g renumber-windows on
set-option -g history-limit 5000

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-left-length 200

set -g status-position top
set-option -g status-style "bg=default"
set-option -g status-style "fg=#31748f"
set -g status-right "%a %b %d %I:%M%p"

# set -g window-status-format "#I❯#W"
# set -g window-status-current-format "#I❯#W"
set -g window-status-current-style fg=#c4a7e7,bg=default
set -g status-left "❮#S❯ "

set -g status-justify centre

run '~/.tmux/plugins/tpm/tpm'
